<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="cog-skull-title cog-skull-desc">
  <title id="cog-skull-title">Machina Opus Mechanicus Cog-Skull Emblem</title>
  <desc id="cog-skull-desc">Adeptus Mechanicus 12-tooth cog wheel housing a half-bone, half-cybernetic cranium with crimson optical lens and brass filigree trim.</desc>
  <defs>
    <radialGradient id="voidBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1a1114"/>
      <stop offset="65%" stop-color="#12161c"/>
      <stop offset="100%" stop-color="#0b0d11"/>
    </radialGradient>
    <linearGradient id="brassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5c158"/>
      <stop offset="45%" stop-color="#d4a853"/>
      <stop offset="100%" stop-color="#9c7a38"/>
    </linearGradient>
    <linearGradient id="crimsonCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="boneLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ece8de"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="cyberRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e2430"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="opticLens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="128" height="256"/>
    </clipPath>
    <clipPath id="rightHalf">
      <rect x="128" y="0" width="128" height="256"/>
    </clipPath>
  </defs>

  <!-- Outer Sanctum Medallion -->
  <circle cx="128" cy="128" r="122" fill="url(#voidBg)" stroke="url(#brassRim)" stroke-width="3"/>
  <circle cx="128" cy="128" r="114" fill="none" stroke="#9c7a38" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- 12-Tooth Opus Mechanicus Cog -->
  <g transform="translate(128,128)">
    <g fill="url(#brassRim)" stroke="#0b0d11" stroke-width="1.5">
      <rect x="-11" y="-106" width="22" height="24" rx="2" transform="rotate(0)"/>
      <rect x="-11" y="-106" width="22" height="24" rx="2" transform="rotate(30)"/>
      <rect x="-11" y="-106" width="22" height="24" rx="2" transform="rotate(60)"/>
      <rect x="-11" y="-106" width="22" height="24" rx="2" transform="rotate(90)"/>
      <rect x="-11" y="-106" width="22" height="24" rx="2" transform="rotate(120)"/>
      <rect x="-11" y="-106" width="22" height="24" rx="2" transform="rotate(150)"/>
      <rect x="-11" y="-106" width="22" height="24" rx="2" transform="rotate(180)"/>
      <rect x="-11" y="-106" width="22" height="24" rx="2" transform="rotate(210)"/>
      <rect x="-11" y="-106" width="22" height="24" rx="2" transform="rotate(240)"/>
      <rect x="-11" y="-106" width="22" height="24" rx="2" transform="rotate(270)"/>
      <rect x="-11" y="-106" width="22" height="24" rx="2" transform="rotate(300)"/>
      <rect x="-11" y="-106" width="22" height="24" rx="2" transform="rotate(330)"/>
    </g>
    <!-- Cog Outer Ring -->
    <circle r="88" fill="#0b0d11" stroke="url(#brassRim)" stroke-width="8"/>
    <!-- Split Background inside Cog (Crimson Left / Obsidian Right) -->
    <path d="M 0,-80 A 80,80 0 0,0 0,80 Z" fill="url(#crimsonCore)" opacity="0.55"/>
    <path d="M 0,-80 A 80,80 0 0,1 0,80 Z" fill="#12161c"/>
    <circle r="80" fill="none" stroke="#d4a853" stroke-width="1.5"/>
    <!-- Rivets on Cog Ring -->
    <g fill="#0b0d11" stroke="#e5c158" stroke-width="1.2">
      <circle cx="0" cy="-88" r="2.6" transform="rotate(15)"/>
      <circle cx="0" cy="-88" r="2.6" transform="rotate(45)"/>
      <circle cx="0" cy="-88" r="2.6" transform="rotate(75)"/>
      <circle cx="0" cy="-88" r="2.6" transform="rotate(105)"/>
      <circle cx="0" cy="-88" r="2.6" transform="rotate(135)"/>
      <circle cx="0" cy="-88" r="2.6" transform="rotate(165)"/>
      <circle cx="0" cy="-88" r="2.6" transform="rotate(195)"/>
      <circle cx="0" cy="-88" r="2.6" transform="rotate(225)"/>
      <circle cx="0" cy="-88" r="2.6" transform="rotate(255)"/>
      <circle cx="0" cy="-88" r="2.6" transform="rotate(285)"/>
      <circle cx="0" cy="-88" r="2.6" transform="rotate(315)"/>
      <circle cx="0" cy="-88" r="2.6" transform="rotate(345)"/>
    </g>
  </g>

  <!-- Left Half: Organic Bone Cranium -->
  <g clip-path="url(#leftHalf)">
    <path d="M 128,58 C 88,58 66,82 66,116 C 66,136 74,148 84,155 L 86,184 L 128,184 L 128,58 Z"
          fill="url(#boneLeft)" stroke="#d4a853" stroke-width="2"/>
    <!-- Cheekbone & Temple Contours -->
    <path d="M 74,114 C 78,102 92,94 112,94" fill="none" stroke="#9c7a38" stroke-width="1.5"/>
    <path d="M 80,142 C 92,146 104,148 118,148" fill="none" stroke="#9c7a38" stroke-width="1.5"/>
    <!-- Left Eye Socket -->
    <circle cx="101" cy="122" r="15" fill="#0b0d11" stroke="#9c7a38" stroke-width="2"/>
    <circle cx="101" cy="122" r="5" fill="#dc2626" opacity="0.8"/>
    <!-- Nasal Cavity Left -->
    <path d="M 128,132 L 117,154 L 128,154 Z" fill="#0b0d11" stroke="#9c7a38" stroke-width="1.5"/>
    <!-- Teeth Left -->
    <g stroke="#0b0d11" stroke-width="2">
      <line x1="96" y1="166" x2="96" y2="184"/>
      <line x1="107" y1="166" x2="107" y2="184"/>
      <line x1="118" y1="166" x2="118" y2="184"/>
      <line x1="86" y1="166" x2="128" y2="166" stroke="#9c7a38" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Right Half: Cybernetic Auger Cranium -->
  <g clip-path="url(#rightHalf)">
    <path d="M 128,58 C 168,58 190,82 190,116 C 190,136 182,148 172,155 L 170,184 L 128,184 L 128,58 Z"
          fill="url(#cyberRight)" stroke="#d4a853" stroke-width="2"/>
    <!-- Cybernetic Plating Seams & Data Conduits -->
    <path d="M 128,76 L 156,76 L 174,94 L 188,94" fill="none" stroke="#d4a853" stroke-width="1.5"/>
    <path d="M 128,92 L 148,92 L 162,106" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    <path d="M 176,144 L 194,154" fill="none" stroke="#d4a853" stroke-width="2"/>
    <!-- Bionic Optical Lens Assembly -->
    <circle cx="155" cy="122" r="19" fill="#181e27" stroke="url(#brassRim)" stroke-width="3"/>
    <circle cx="155" cy="122" r="13" fill="url(#opticLens)" stroke="#fca5a5" stroke-width="1"/>
    <circle cx="155" cy="122" r="5" fill="#ffffff" opacity="0.9"/>
    <!-- Lens Crosshairs -->
    <line x1="134" y1="122" x2="142" y2="122" stroke="#d4a853" stroke-width="1.5"/>
    <line x1="168" y1="122" x2="176" y2="122" stroke="#d4a853" stroke-width="1.5"/>
    <line x1="155" y1="101" x2="155" y2="109" stroke="#d4a853" stroke-width="1.5"/>
    <line x1="155" y1="135" x2="155" y2="143" stroke="#d4a853" stroke-width="1.5"/>
    <!-- Nasal Vent Right -->
    <path d="M 128,132 L 139,154 L 128,154 Z" fill="#0b0d11" stroke="#d4a853" stroke-width="1.5"/>
    <!-- Vox-Grille Jaw Right -->
    <rect x="128" y="162" width="42" height="22" fill="#0b0d11" stroke="#d4a853" stroke-width="1.5"/>
    <g stroke="#d4a853" stroke-width="2">
      <line x1="136" y1="164" x2="136" y2="182"/>
      <line x1="145" y1="164" x2="145" y2="182"/>
      <line x1="154" y1="164" x2="154" y2="182"/>
      <line x1="163" y1="164" x2="163" y2="182"/>
    </g>
  </g>

  <!-- Central Bisecting Brass Seam & Neural Crown -->
  <line x1="128" y1="48" x2="128" y2="192" stroke="url(#brassRim)" stroke-width="2.5"/>
  <circle cx="128" cy="76" r="4" fill="#dc2626" stroke="#d4a853" stroke-width="1.5"/>

  <!-- Corner Brass Filigree Accents -->
  <g fill="none" stroke="url(#brassRim)" stroke-width="2">
    <path d="M 14,34 L 14,14 L 34,14"/>
    <path d="M 242,34 L 242,14 L 222,14"/>
    <path d="M 14,222 L 14,242 L 34,242"/>
    <path d="M 242,222 L 242,242 L 222,242"/>
  </g>
</svg>
