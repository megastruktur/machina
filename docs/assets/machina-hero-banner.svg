<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">MACHINA — M.A.I. (Machina Anima Intelligentia) Noosphere Cogitator Banner</title>
  <desc id="hero-desc">Widescreen Adeptus Mechanicus Noosphere Cogitator banner with the Cog-Skull emblem, brass filigree, crimson glow, void obsidian background, MACHINA, and M.A.I. — Machina Anima Intelligentia.</desc>
  <defs>
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d11"/>
      <stop offset="50%" stop-color="#12161c"/>
      <stop offset="100%" stop-color="#0b0d11"/>
    </linearGradient>
    <radialGradient id="crimsonGlow" cx="20%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#b91c1c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b0d11" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9c7a38"/>
      <stop offset="50%" stop-color="#d4a853"/>
      <stop offset="100%" stop-color="#9c7a38"/>
    </linearGradient>
    <linearGradient id="crimsonBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="65%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#1a1114"/>
    </linearGradient>
    <pattern id="noosphereGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a3241" stroke-width="0.6" stroke-opacity="0.55"/>
      <circle cx="40" cy="40" r="1" fill="#9c7a38" fill-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Void Obsidian Canvas -->
  <rect width="1200" height="320" fill="url(#obsidianBg)"/>
  <rect width="1200" height="320" fill="url(#noosphereGrid)"/>
  <rect width="1200" height="320" fill="url(#crimsonGlow)"/>

  <!-- Outer Brass Sanctum Frame & Filigree -->
  <rect x="10" y="10" width="1180" height="300" rx="6" fill="none" stroke="url(#brassGrad)" stroke-width="2"/>
  <rect x="16" y="16" width="1168" height="288" rx="4" fill="none" stroke="#9c7a38" stroke-width="1" stroke-dasharray="10 5"/>

  <!-- Corner Brass Filigree Brackets -->
  <g fill="none" stroke="#d4a853" stroke-width="2.5">
    <path d="M 10,46 L 10,10 L 46,10"/>
    <path d="M 22,34 L 22,22 L 34,22"/>
    <path d="M 1190,46 L 1190,10 L 1154,10"/>
    <path d="M 1178,34 L 1178,22 L 1166,22"/>
    <path d="M 10,274 L 10,310 L 46,310"/>
    <path d="M 22,286 L 22,298 L 34,298"/>
    <path d="M 1190,274 L 1190,310 L 1154,310"/>
    <path d="M 1178,286 L 1178,298 L 1166,298"/>
  </g>

  <!-- Top & Bottom Crimson Oath Bands -->
  <rect x="46" y="10" width="1108" height="4" fill="url(#crimsonBar)"/>
  <rect x="46" y="306" width="1108" height="4" fill="url(#crimsonBar)"/>

  <!-- Left Medallion: Opus Mechanicus Cog-Skull (Centered at 190, 160) -->
  <g transform="translate(190, 160)">
    <!-- Outer Telemetry Halo -->
    <circle r="112" fill="none" stroke="#9c7a38" stroke-width="1" stroke-dasharray="4 6"/>
    <circle r="102" fill="#0b0d11" fill-opacity="0.85" stroke="#d4a853" stroke-width="1.5"/>

    <!-- 12-Tooth Cog Wheel -->
    <g fill="#d4a853" stroke="#0b0d11" stroke-width="1.2">
      <rect x="-9" y="-92" width="18" height="20" rx="1.5" transform="rotate(0)"/>
      <rect x="-9" y="-92" width="18" height="20" rx="1.5" transform="rotate(30)"/>
      <rect x="-9" y="-92" width="18" height="20" rx="1.5" transform="rotate(60)"/>
      <rect x="-9" y="-92" width="18" height="20" rx="1.5" transform="rotate(90)"/>
      <rect x="-9" y="-92" width="18" height="20" rx="1.5" transform="rotate(120)"/>
      <rect x="-9" y="-92" width="18" height="20" rx="1.5" transform="rotate(150)"/>
      <rect x="-9" y="-92" width="18" height="20" rx="1.5" transform="rotate(180)"/>
      <rect x="-9" y="-92" width="18" height="20" rx="1.5" transform="rotate(210)"/>
      <rect x="-9" y="-92" width="18" height="20" rx="1.5" transform="rotate(240)"/>
      <rect x="-9" y="-92" width="18" height="20" rx="1.5" transform="rotate(270)"/>
      <rect x="-9" y="-92" width="18" height="20" rx="1.5" transform="rotate(300)"/>
      <rect x="-9" y="-92" width="18" height="20" rx="1.5" transform="rotate(330)"/>
    </g>

    <circle r="76" fill="#0b0d11" stroke="#d4a853" stroke-width="6"/>
    <path d="M 0,-70 A 70,70 0 0,0 0,70 Z" fill="#b91c1c" fill-opacity="0.45"/>
    <path d="M 0,-70 A 70,70 0 0,1 0,70 Z" fill="#181e27"/>
    <circle r="70" fill="none" stroke="#9c7a38" stroke-width="1.2"/>

    <!-- Half-Skull / Half-Cybernetic Cranium -->
    <path d="M 0,-50 C -34,-50 -50,-30 -50,-2 C -50,14 -42,24 -34,30 L -32,52 L 0,52 Z"
          fill="#ece8de" stroke="#d4a853" stroke-width="1.6"/>
    <path d="M 0,-50 C 34,-50 50,-30 50,-2 C 50,14 42,24 34,30 L 32,52 L 0,52 Z"
          fill="#1e2430" stroke="#d4a853" stroke-width="1.6"/>
    <!-- Left Eye Socket + Right Cybernetic Optic -->
    <circle cx="-21" cy="-2" r="11" fill="#0b0d11" stroke="#9c7a38" stroke-width="1.5"/>
    <circle cx="-21" cy="-2" r="4" fill="#dc2626"/>
    <circle cx="21" cy="-2" r="14" fill="#0b0d11" stroke="#d4a853" stroke-width="2.5"/>
    <circle cx="21" cy="-2" r="9" fill="#dc2626"/>
    <circle cx="21" cy="-2" r="3.5" fill="#fca5a5"/>
    <!-- Nasal Vent & Vox Grille -->
    <polygon points="0,8 -9,24 9,24" fill="#0b0d11" stroke="#d4a853" stroke-width="1.2"/>
    <line x1="-32" y1="36" x2="32" y2="36" stroke="#d4a853" stroke-width="1.5"/>
    <g stroke="#0b0d11" stroke-width="2">
      <line x1="-22" y1="36" x2="-22" y2="52"/>
      <line x1="-11" y1="36" x2="-11" y2="52"/>
    </g>
    <g stroke="#d4a853" stroke-width="1.8">
      <line x1="11" y1="36" x2="11" y2="52"/>
      <line x1="22" y1="36" x2="22" y2="52"/>
      <line x1="0" y1="-56" x2="0" y2="58"/>
    </g>
  </g>

  <!-- Noosphere Circuit Conduit Joining Emblem to Typography -->
  <g fill="none" stroke="#d4a853" stroke-width="1.5">
    <path d="M 304,160 L 348,160"/>
    <path d="M 322,160 L 336,142 L 1140,142" stroke="#9c7a38" stroke-width="1"/>
    <circle cx="348" cy="160" r="3.5" fill="#dc2626" stroke="#d4a853" stroke-width="1.5"/>
  </g>

  <!-- Primary Typography & Doctrinal Metadata -->
  <g transform="translate(366, 0)">
    <!-- Top Sanctum Rubric -->
    <rect x="0" y="44" width="380" height="24" rx="3" fill="#1a1114" stroke="#b91c1c" stroke-width="1"/>
    <circle cx="14" cy="56" r="4" fill="#dc2626"/>
    <text x="28" y="60" fill="#fca5a5" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="600" letter-spacing="2">
      NOOSPHERE COGITATOR SANCTUM // OMNISSIAH DECK
    </text>

    <!-- Primary Title: MACHINA -->
    <text x="0" y="124" fill="#ece8de" font-family="'Cinzel', Georgia, serif" font-size="56" font-weight="700" letter-spacing="8">
      MACHINA
    </text>

    <!-- Subtitle: M.A.I. — Machina Anima Intelligentia -->
    <text x="2" y="168" fill="#d4a853" font-family="'Cinzel', Georgia, serif" font-size="21" font-weight="600" letter-spacing="2.2">
      M.A.I. — Machina Anima Intelligentia
    </text>

    <!-- Functional Descriptor -->
    <text x="2" y="202" fill="#94a3b8" font-family="'Rajdhani', system-ui, sans-serif" font-size="16" font-weight="500" letter-spacing="0.6">
      Self-Hosted AI Linux Administration Console · Windowed Command Deck · Categorized Server Service Map · Supervised OpenSSH
    </text>

    <!-- Bottom Pill Badges -->
    <g transform="translate(0, 224)" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11.5" font-weight="600">
      <rect x="0" y="0" width="196" height="28" rx="4" fill="#181e27" stroke="#d4a853" stroke-width="1.2"/>
      <text x="14" y="18" fill="#ece8de">⚙ ALWAYS-ON CHAT DOCK</text>

      <rect x="210" y="0" width="194" height="28" rx="4" fill="#181e27" stroke="#9c7a38" stroke-width="1.2"/>
      <text x="224" y="18" fill="#d4a853">🗺 SERVER SERVICE MAP</text>

      <rect x="418" y="0" width="204" height="28" rx="4" fill="#181e27" stroke="#b91c1c" stroke-width="1.2"/>
      <text x="432" y="18" fill="#fca5a5">🔒 POLICY-GATED OPENSSH</text>

      <rect x="636" y="0" width="162" height="28" rx="4" fill="#181e27" stroke="#155e46" stroke-width="1.2"/>
      <text x="650" y="18" fill="#6ee7b7">✓ DBOS DURABLE RUNS</text>
    </g>

    <!-- Observe -> Understand -> Plan -> Execute -> Verify -> Document Loop Footer -->
    <text x="2" y="280" fill="#9c7a38" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" letter-spacing="1.4">
      OBSERVE → UNDERSTAND → PLAN → EXECUTE UNDER POLICY → VERIFY → DOCUMENT &amp; REMEMBER
    </text>
  </g>
</svg>
