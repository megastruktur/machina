<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Machina (M.A.I.) Architecture &amp; Operational Dataflow</title>
  <desc id="arch-desc">Vector diagram showing the Operator Workspace (Draggable Windows, Always-Visible Bottom Chat Dock, Server Service Map) communicating with mai-api and mai-worker, which supervise Target Servers and Capabilities (app.upsert_map_entry, chat.read_session, host.shell).</desc>
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d11"/>
      <stop offset="50%" stop-color="#12161c"/>
      <stop offset="100%" stop-color="#0b0d11"/>
    </linearGradient>
    <linearGradient id="brassStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9c7a38"/>
      <stop offset="50%" stop-color="#d4a853"/>
      <stop offset="100%" stop-color="#9c7a38"/>
    </linearGradient>
    <marker id="arrowBrass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d4a853"/>
    </marker>
    <marker id="arrowCrimson" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Void Background & Brass Frame -->
  <rect width="1200" height="420" rx="8" fill="url(#archBg)" stroke="url(#brassStroke)" stroke-width="2"/>
  <rect x="8" y="8" width="1184" height="404" rx="5" fill="none" stroke="#2a3241" stroke-width="1"/>

  <!-- Diagram Header Banner -->
  <rect x="20" y="18" width="1160" height="38" rx="4" fill="#1a1114" stroke="#9c7a38" stroke-width="1.2"/>
  <text x="38" y="42" fill="#d4a853" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="700" letter-spacing="2">
    MACHINA NOOSPHERE ARCHITECTURE — OPERATOR WORKSPACE → CONTROLLER → TARGET SERVERS
  </text>
  <text x="1162" y="42" text-anchor="end" fill="#94a3b8" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11">
    C01–C11 BOUNDARIES
  </text>

  <!-- ===================================================================== -->
  <!-- COLUMN 1: OPERATOR WORKSPACE (mai-web)                                -->
  <!-- ===================================================================== -->
  <g transform="translate(24, 72)">
    <rect width="340" height="324" rx="6" fill="#12161c" stroke="#d4a853" stroke-width="1.8"/>
    <rect width="340" height="34" rx="6" fill="#1a1114" stroke="#d4a853" stroke-width="1.2"/>
    <text x="16" y="22" fill="#ece8de" font-family="'Cinzel', Georgia, serif" font-size="13.5" font-weight="700" letter-spacing="1">
      1. OPERATOR WORKSPACE (mai-web)
    </text>

    <!-- Sub-box 1: Draggable Windows -->
    <g transform="translate(16, 48)">
      <rect width="308" height="72" rx="4" fill="#181e27" stroke="#2a3241" stroke-width="1.2"/>
      <text x="12" y="20" fill="#d4a853" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="600">
        ◰ Draggable Multi-Window Command Deck
      </text>
      <text x="12" y="40" fill="#ece8de" font-family="'Rajdhani', system-ui, sans-serif" font-size="13">
        Server-pinned &amp; Global panels: Overview, Policy,
      </text>
      <text x="12" y="57" fill="#94a3b8" font-family="'Rajdhani', system-ui, sans-serif" font-size="12.5">
        Jobs, Receipts, Docs, Plugins, Memory &amp; Models
      </text>
    </g>

    <!-- Sub-box 2: Categorized Server Service Map -->
    <g transform="translate(16, 132)">
      <rect width="308" height="82" rx="4" fill="#181e27" stroke="#9c7a38" stroke-width="1.4"/>
      <text x="12" y="20" fill="#d4a853" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="600">
        🗺 Server Service Map &amp; Categories
      </text>
      <text x="12" y="40" fill="#ece8de" font-family="'Rajdhani', system-ui, sans-serif" font-size="13">
        8 built-in + custom categories, filter pills, 5-step
      </text>
      <text x="12" y="57" fill="#ece8de" font-family="'Rajdhani', system-ui, sans-serif" font-size="13">
        operational runbooks &amp; one-click [Chat @service]
      </text>
      <text x="12" y="73" fill="#6ee7b7" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5">
        games · ai · agent · system · dev · infra · media · obs
      </text>
    </g>

    <!-- Sub-box 3: Always-Visible Bottom Chat Dock -->
    <g transform="translate(16, 226)">
      <rect width="308" height="84" rx="4" fill="#1a1114" stroke="#dc2626" stroke-width="1.6"/>
      <text x="12" y="20" fill="#fca5a5" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="600">
        💬 Always-Visible Bottom Chat Dock
      </text>
      <text x="12" y="40" fill="#ece8de" font-family="'Rajdhani', system-ui, sans-serif" font-size="13">
        Immutable [🖥 Server] + [@service] context chips,
      </text>
      <text x="12" y="57" fill="#ece8de" font-family="'Rajdhani', system-ui, sans-serif" font-size="13">
        General Consult mode &amp; Floating History Selector
      </text>
      <text x="12" y="74" fill="#d4a853" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5">
        🔒 Context locks once conversation run starts
      </text>
    </g>
  </g>

  <!-- Arrows Column 1 -> Column 2 -->
  <g stroke-width="2" fill="none">
    <line x1="364" y1="168" x2="424" y2="168" stroke="#d4a853" marker-end="url(#arrowBrass)"/>
    <text x="394" y="158" text-anchor="middle" fill="#d4a853" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10">
      REST /api/v1
    </text>
    <line x1="424" y1="268" x2="364" y2="268" stroke="#dc2626" marker-end="url(#arrowCrimson)"/>
    <text x="394" y="258" text-anchor="middle" fill="#fca5a5" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10">
      SSE Events
    </text>
  </g>

  <!-- ===================================================================== -->
  <!-- COLUMN 2: CONTROLLER PLANE (mai-api / mai-worker / postgres)          -->
  <!-- ===================================================================== -->
  <g transform="translate(430, 72)">
    <rect width="340" height="324" rx="6" fill="#12161c" stroke="#d4a853" stroke-width="1.8"/>
    <rect width="340" height="34" rx="6" fill="#1a1114" stroke="#d4a853" stroke-width="1.2"/>
    <text x="16" y="22" fill="#ece8de" font-family="'Cinzel', Georgia, serif" font-size="13.5" font-weight="700" letter-spacing="1">
      2. CONTROLLER PLANE (mai-api &amp; mai-worker)
    </text>

    <!-- Sub-box 1: mai-api -->
    <g transform="translate(16, 48)">
      <rect width="308" height="76" rx="4" fill="#181e27" stroke="#9c7a38" stroke-width="1.3"/>
      <text x="12" y="20" fill="#d4a853" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="600">
        ⚙ mai-api (FastAPI Control Boundary)
      </text>
      <text x="12" y="40" fill="#ece8de" font-family="'Rajdhani', system-ui, sans-serif" font-size="13">
        Session + CSRF auth, capability policy engine,
      </text>
      <text x="12" y="57" fill="#94a3b8" font-family="'Rajdhani', system-ui, sans-serif" font-size="12.5">
        one-use approval tokens &amp; canonical JSON sync
      </text>
    </g>

    <!-- Sub-box 2: mai-worker -->
    <g transform="translate(16, 136)">
      <rect width="308" height="82" rx="4" fill="#181e27" stroke="#dc2626" stroke-width="1.4"/>
      <text x="12" y="20" fill="#fca5a5" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="600">
        ⚡ mai-worker (DBOS Durable Runner)
      </text>
      <text x="12" y="40" fill="#ece8de" font-family="'Rajdhani', system-ui, sans-serif" font-size="13">
        Lease-fenced workflows, agent tool loop, child
      </text>
      <text x="12" y="57" fill="#ece8de" font-family="'Rajdhani', system-ui, sans-serif" font-size="13">
        delegation tree &amp; secret-redacted step receipts
      </text>
      <text x="12" y="73" fill="#d4a853" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5">
        Injects pinned @service runbooks into agent prompt
      </text>
    </g>

    <!-- Sub-box 3: Postgres + Canonical State -->
    <g transform="translate(16, 230)">
      <rect width="308" height="80" rx="4" fill="#181e27" stroke="#2a3241" stroke-width="1.2"/>
      <text x="12" y="20" fill="#7dd3fc" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="600">
        🗄 postgres (pgvector) + /var/lib/mai
      </text>
      <text x="12" y="40" fill="#ece8de" font-family="'Rajdhani', system-ui, sans-serif" font-size="13">
        Adopted service manifests, category taxonomy,
      </text>
      <text x="12" y="57" fill="#94a3b8" font-family="'Rajdhani', system-ui, sans-serif" font-size="12.5">
        hybrid knowledge store, SearXNG &amp; Hindsight memory
      </text>
    </g>
  </g>

  <!-- Arrows Column 2 -> Column 3 -->
  <g stroke-width="2" fill="none">
    <line x1="770" y1="180" x2="830" y2="180" stroke="#d4a853" marker-end="url(#arrowBrass)"/>
    <text x="800" y="170" text-anchor="middle" fill="#d4a853" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10">
      OpenSSH
    </text>
    <line x1="770" y1="260" x2="830" y2="260" stroke="#dc2626" marker-end="url(#arrowCrimson)"/>
    <text x="800" y="250" text-anchor="middle" fill="#fca5a5" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10">
      Capabilities
    </text>
  </g>

  <!-- ===================================================================== -->
  <!-- COLUMN 3: TARGET SERVERS & AGENT CAPABILITIES                         -->
  <!-- ===================================================================== -->
  <g transform="translate(836, 72)">
    <rect width="340" height="324" rx="6" fill="#12161c" stroke="#d4a853" stroke-width="1.8"/>
    <rect width="340" height="34" rx="6" fill="#1a1114" stroke="#d4a853" stroke-width="1.2"/>
    <text x="16" y="22" fill="#ece8de" font-family="'Cinzel', Georgia, serif" font-size="13.5" font-weight="700" letter-spacing="1">
      3. TARGET SERVERS &amp; CAPABILITIES
    </text>

    <!-- Sub-box 1: app.upsert_map_entry -->
    <g transform="translate(16, 48)">
      <rect width="308" height="82" rx="4" fill="#181e27" stroke="#d4a853" stroke-width="1.4"/>
      <text x="12" y="20" fill="#6ee7b7" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="600">
        🛠 app.upsert_map_entry
      </text>
      <text x="12" y="40" fill="#ece8de" font-family="'Rajdhani', system-ui, sans-serif" font-size="13">
        Agent capability to register/update Service Map
      </text>
      <text x="12" y="57" fill="#ece8de" font-family="'Rajdhani', system-ui, sans-serif" font-size="13">
        entries, mint custom categories &amp; save 5-slot
      </text>
      <text x="12" y="73" fill="#94a3b8" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5">
        install · update · uninstall · backup · verify
      </text>
    </g>

    <!-- Sub-box 2: chat.read_session -->
    <g transform="translate(16, 142)">
      <rect width="308" height="74" rx="4" fill="#181e27" stroke="#9c7a38" stroke-width="1.3"/>
      <text x="12" y="20" fill="#7dd3fc" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="600">
        📜 chat.read_session
      </text>
      <text x="12" y="40" fill="#ece8de" font-family="'Rajdhani', system-ui, sans-serif" font-size="13">
        Read-only cross-session recall of prior chat
      </text>
      <text x="12" y="57" fill="#94a3b8" font-family="'Rajdhani', system-ui, sans-serif" font-size="12.5">
        transcripts, run outcomes &amp; @service context
      </text>
    </g>

    <!-- Sub-box 3: host.shell & Supervised Target Hosts -->
    <g transform="translate(16, 228)">
      <rect width="308" height="82" rx="4" fill="#1a1114" stroke="#b91c1c" stroke-width="1.5"/>
      <text x="12" y="20" fill="#fca5a5" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="600">
        🖥 host.shell &amp; Target Linux Hosts
      </text>
      <text x="12" y="40" fill="#ece8de" font-family="'Rajdhani', system-ui, sans-serif" font-size="13">
        Pinned SHA256 host keys, Docker Compose stacks,
      </text>
      <text x="12" y="57" fill="#ece8de" font-family="'Rajdhani', system-ui, sans-serif" font-size="13">
        systemd units &amp; listen-port discovery lanes
      </text>
      <text x="12" y="73" fill="#d4a853" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5">
        Grant scopes: none · narrow · broad
      </text>
    </g>
  </g>
</svg>
