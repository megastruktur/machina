<!doctype html>
<!-- Encapsulated Theme Contract: the default theme is Mechanicus (Forge
     World Mars). Theme switching requires only changing `data-theme` on this
     element (e.g. to "standard"); no stylesheet or class changes. -->
<html lang="en" data-theme="mechanicus">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
