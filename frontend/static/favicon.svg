<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="crimson" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="65%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Outer 8-tooth Mechanicus Cog (bright gold/brass so it pops on dark & light tab bars) -->
  <g fill="url(#brass)" stroke="#451a03" stroke-width="1.5" stroke-linejoin="round">
    <rect x="27" y="2" width="10" height="60" rx="2" />
    <rect x="2" y="27" width="60" height="10" rx="2" />
    <rect x="27" y="2" width="10" height="60" rx="2" transform="rotate(45 32 32)" />
    <rect x="27" y="2" width="10" height="60" rx="2" transform="rotate(-45 32 32)" />
    <circle cx="32" cy="32" r="23.5" />
  </g>

  <!-- Inner brass bezel highlight -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#fef08a" stroke-width="1.2" opacity="0.85" />

  <!-- Martian Crimson Sanctum Core (split black/crimson Mechanicus field) -->
  <circle cx="32" cy="32" r="18.5" fill="url(#crimson)" stroke="#181e27" stroke-width="2" />
  <path d="M 32,13.5 A 18.5,18.5 0 0,0 32,50.5 Z" fill="#12161c" />

  <!-- Opus Machina Skull / Cybernetic Core -->
  <path
    d="M 32,18 C 24.5,18 20,23 20,29.5 C 20,33.5 22,36.8 24.5,38.5 L 24.5,44 L 28,44 L 28,40.5 L 30.5,40.5 L 30.5,44 L 33.5,44 L 33.5,40.5 L 36,40.5 L 36,44 L 39.5,44 L 39.5,38.5 C 42,36.8 44,33.5 44,29.5 C 44,23 39.5,18 32,18 Z"
    fill="url(#ivory)"
    stroke="#0b0d10"
    stroke-width="1.6"
    stroke-linejoin="round"
  />

  <!-- Right half cybernetic brass plate overlay -->
  <path
    d="M 32,18 C 39.5,18 44,23 44,29.5 C 44,33.5 42,36.8 39.5,38.5 L 39.5,44 L 36,44 L 36,40.5 L 33.5,40.5 L 33.5,44 L 32,44 Z"
    fill="#f59e0b"
    fill-opacity="0.35"
  />

  <!-- Left ocular socket (dark void + crimson pinpoint) -->
  <circle cx="26.8" cy="29.5" r="3.6" fill="#0b0d10" />
  <circle cx="26.8" cy="29.5" r="1.5" fill="#ef4444" />

  <!-- Right bionics targeter lens (glowing cyan-emerald) -->
  <circle cx="37.2" cy="29.5" r="4.2" fill="#0b0d10" stroke="#fde68a" stroke-width="1.2" />
  <circle cx="37.2" cy="29.5" r="2.2" fill="#38bdf8" />
  <circle cx="37.8" cy="28.9" r="0.8" fill="#ffffff" />

  <!-- Nasal resonator -->
  <polygon points="32,32.5 30,36.5 34,36.5" fill="#0b0d10" />
</svg>
