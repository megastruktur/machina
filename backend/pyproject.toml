[project]
name = "mai"
version = "0.1.0"
description = "MAI controller backend package"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    # Durable engine: exact pin frozen by docs/architecture/contracts.md C05 and
    # docs/architecture/job-engine.md ("Tested exactly: dbos==3.2.0").
    "dbos==3.2.0",
    # API framework of the controller backend (traceability: "Python FastAPI /
    # SvelteKit / Docker Compose / PostgreSQL"). ASGI server choice belongs to
    # the api/compose cards, not the package lane.
    "fastapi",
    # Schema migration harness owner (card 01-db allowlists backend/alembic.ini
    # and backend/migrations/env.py; SERVICES locks the migration chain to one
    # linear Alembic chain). Bounded <2 so major-version chain rewrites are a
    # deliberate reconciliation, not a silent upgrade.
    "alembic>=1.16,<2",
    # SSH/host-execution transport is the SYSTEM OpenSSH client driven via
    # subprocess — the P00 ssh-spike decision (docs/architecture/host-supervision.md,
    # probe experiments/ssh_supervision_probe.py) selected NO third-party SSH
    # library, so nothing is pinned here for it. The runtime dependency (ssh,
    # ssh-keygen, ssh-keyscan binaries and the frozen probe option surface) is
    # asserted by backend/tests/test_execution_dependencies.py instead.
    # Argon2id credential hashing (auth ADR 3e79449 §3.1, contracts.md C08
    # rule 1). Deferred to this card by the packaging owner: 01-python
    # evidence README, "argon2/session deps (02-auth)". Bounded <26 so the
    # next binding-generation bump is a deliberate review, not a silent
    # upgrade of a security primitive.
    "argon2-cffi>=23.1,<26",
    # Agent runtime (IDEA.md §2/§8: PydanticAI over configurable
    # OpenAI-compatible endpoints; contracts.md C06). The slim distribution
    # with ONLY the `openai` extra is the minimal provider adapter set: the
    # configured gateway is OpenAI-compatible (AGT-PROVIDER scenario,
    # runtime-scenarios.md). No other provider extra (anthropic, google,
    # groq, …) and no scheduler extra (the durable engine stays the frozen
    # dbos==3.2.0 direct pin, contracts.md C05 — pydantic-ai's dbos/temporal/
    # prefect extras are alternate-engine vectors) may enter silently;
    # backend/tests/test_agent_dependencies.py holds both negative controls
    # across manifest, lock and installed environment. Bounded <3 so the
    # framework's next major API break is a deliberate reconciliation with
    # its downstream consumers (06-agent-run/06-tool-bridge), not a silent
    # upgrade; within 2.x the lock file fixes the exact resolved version.
    "pydantic-ai-slim[openai]>=2.56,<3",
    # Document-chunk embeddings client (contracts.md C07 rule 3/7; ADR
    # docs/architecture/knowledge-packaging.md §4): the doc index embeds via
    # POST {base_url}/v1/embeddings on the SAME configured OpenAI-compatible
    # connection as the chat path — the `embeddings.create` surface of this
    # SDK, never /chat/completions. Direct declaration (was locked only as the
    # pydantic-ai-slim[openai] extra's requirement while src/mai already
    # imports it); the SDK is Apache-2.0-licensed; bounds mirror that extra's
    # floor (openai>=3.26.0) with the major cap so the next SDK major is a
    # silent upgrade. backend/tests/test_knowledge_dependencies.py verifies
    # the exact request/response surface offline (mock transport) and holds
    # the C07 dimension tuple (text-embedding-3-small / 1536 / cosine).
    "openai>=3.26,<4",
    # Vector column access layer for the frozen store (ADR §4.1/§4.2: the
    # controller's own PostgreSQL + pgvector, vector(1536) HNSW
    # vector_cosine_ops — a dedicated vector-database service is rejected).
    # Provides the supported SQLAlchemy type (pgvector.sqlalchemy.Vector) for
    # the 07-vector-schema migration and the cosine-distance expression for
    # 07-chunk-index/07-retrieval; pgvector.psycopg adapts parameters on the
    # locked psycopg3 application driver (src/mai/database.py). Distribution
    # MIT; the server-side extension it addresses is PostgreSQL-licensed
    # (delivered by the pgvector-enabled Postgres image, Compose cards — not
    # a Python dependency). Bounded to the verified 0.5 line: inside a 0.x
    # major the minor is the breaking axis, so the next minor bump is a
    # deliberate review, not a silent upgrade.
    "pgvector>=0.5,<0.6",
    # HTTP fetch client (ADR §3.2: SearXNG returns result metadata, page
    # fetching/extraction is MAI's own capability; C07 rule 7 search JSON).
    # httpx2 is the BSD-3-Clause client already locked as the openai SDK's
    # transport — one HTTP stack for the knowledge lane (07-search-capability,
    # 07-page-reader, 07-service-http, 11-memory-adapter Hindsight HTTP).
    # Plain async client only: no extra (cli/http2/socks/zstd/brotli stay
    # unselected) and NO browser automation — page fetch is bounded HTTP,
    # never an embedded/unbounded browser install (acceptance criterion 2).
    # Bounded <3 so the client's next major is a deliberate reconciliation.
    "httpx2>=2.13,<3",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mai"]
