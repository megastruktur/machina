# MAI application schema migration harness (card 01-db).
#
# The database URL is NOT stored in this file: migrations/env.py resolves it
# from the environment (MAI_DATABASE_URL) via mai.database — the single secret
# reference for the database (contracts.md C03/C05; job-engine ADR).
#
# Revisions live in migrations/versions/ as one linear chain owned by the
# migration-chain resource (mai_SERVICES.md "Repository and ownership lanes").
# This harness ships an empty chain. DBOS 3.2.0 system tables are engine-owned
# and created at engine launch (docs/architecture/job-engine.md, run-state
# ownership); they never appear in this chain.

[alembic]
script_location = %(here)s/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
