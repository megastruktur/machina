deploy:
  image: docker.io/filebrowser/filebrowser@sha256:593478e3c24c5ea9f5d7478dc549965b7bc7030707291006ce8d0b6162d3454b
  ports:
    - host: 18081
      container: 80
      protocol: tcp
  volumes:
    - name: srv-files
      container_path: /srv
health:
  kind: http
  port: 80
  path: /health
  expected_status: 200
  interval_seconds: 10
  timeout_seconds: 5
  retries: 3
  start_period_seconds: 10
update:
  migrations: none
removal:
  data_policy: explicit_choice
recovery:
  image_rollback: true
backup:
