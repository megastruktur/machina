# MAI maintained-catalogue recipe: Odysseus self-hosted AI workspace
# (card 11-odysseus-recipe; validated by backend/tests/test_odysseus_recipe.py
# through the canonical recipe schema frozen by 08-recipe-schema, C09 rule 2).
#
# Independently authored from the upstream DOCUMENTED installation interface
# (never from its implementation; IDEA.md: inspiration only, no code reuse):
#   - source:        https://github.com/odysseus-dev/odysseus (AGPL-3.0-or-later)
#   - install docs:  README "Quick Start" + website/setup.md ("Docker
#     (recommended)"): docker compose with the official multi-arch image
#     ghcr.io/odysseus-dev/odysseus, container port 7000, first admin
#     password printed in `docker compose logs odysseus`.
#   - maintenance:   upstream docs are in-repo (website/setup.md: deploy,
#     upgrades, GPU overlays, security notes; README security section).
#
# Image facts (registry-verified 2026-10-18; provenance in
# mai_evidence/11-odysseus-recipe/):
#   - the pinned digest is the OCI index of tag 1.0.3, which is byte-identical
#     to `:latest` at authoring time (curated `main` build; upstream docs:
#     `:latest` and bare `:X.Y.Z` move on every push to `main`, so MAI pins
#     the digest, not the tag). linux amd64 + arm64 -> declared below.
#   - unpacked size 2.62 GiB (chromium/node/tmux tooling baked in) — covered
#     by the hw.disk.10gb budget token below.
#   - the image SHIPS /usr/bin/curl, so the schema's frozen argv healthcheck
#     (CMD curl --fail ...) actually runs inside this container.
#   - health endpoints probed on this exact digest: GET /api/health -> 200
#     {"status":"healthy",...} unauthenticated (documented liveness route);
#     GET / -> 302 to /login; GET /login -> 200; GET /api/version ->
#     {"version":"1.0.3"}. GET /api/ready (readiness) is AUTH-GATED (401
#     unauthenticated), so it cannot serve as an argv curl healthcheck; the
#     recipe declares the honest liveness probe /api/health.
#
# Standalone single-service curation (acceptance 2: no production-stack
# mutation)
# -------------------------------------------------------------
# The upstream documented install is a FOUR-service Compose stack (odysseus +
# chromadb + searxng + ntfy). The canonical schema v1 deploys exactly ONE
# service, and MAI's production stack already runs its own SearXNG — a recipe
# that re-deploys chromadb/searxng/ntfy would duplicate MAI services and
# collide with the production stack. This recipe therefore deploys ONLY the
# odysseus service. VERIFIED on this exact digest: the container boots and
# serves standalone; the absent bundled services are DEGRADED, not fatal —
# startup logs "VectorRAG init failed: ChromaDB is not reachable" /
# "MemoryVectorStore DEGRADED" and the app retries, while web UI, login,
# /api/health and /api/version stay fully functional. Bundled search/RAG are
# configured by the admin INSIDE Odysseus after install (Settings), pointing
# at existing endpoints; the deployment plan neither provisions nor mutates
# them.
#
# First credential flow (documented upstream, no recipe credential): the
# first admin account is created on first setup and its temporary password
# is printed to the odysseus logs. The recipe declares NO credential
# references (C03: values live in the configured resolver; nothing here
# could carry one).
#
# Resource budget (acceptance 2: exact resource limits)
# -----------------------------------------------------
#   - hw.ram.2gb: measured 508.6 MiB RSS at idle on the pinned digest;
#     2 GiB is the honest minimum (4x headroom; provisioned AT the C10
#     disposable-envelope cap the recipe is verifiable in a fixture).
#   - hw.disk.10gb: 2.62 GiB unpacked image + user data (sqlite DB, uploads,
#     caches) with headroom. Cookbook model downloads are explicit in-app
#     admin acquisitions AFTER install and carry their own budgets, exactly
#     like the sibling local-inference recipe's per-model rule.
#   - host port 18111 (unprivileged >=1024 per frozen schema policy; free on
#     the approved host; the MAI production stack publishes NO host ports, so
#     no collision is possible).
schema_version: 1
name: odysseus
supported_environment:
  os:
    - linux
  arch:
    - aarch64
    - x86_64
prerequisites:
  - docker
  - hw.ram.2gb
  - hw.disk.10gb
required_grants:
  - docker.compose
deploy:
  image: ghcr.io/odysseus-dev/odysseus@sha256:4aa6e607d2108bd7b5f37ee1a0841dc56e6bbac36e9ccd5e1705aff7ea36fb04
  ports:
    - host: 18111
      container: 7000
      protocol: tcp
  volumes:
    # The five upstream-persisted container paths (upstream compose mounts;
    # host paths are planner-allocated under /var/lib/mai/apps/<id>/volumes).
    - name: data
      container_path: /app/data
    - name: logs
      container_path: /app/logs
    - name: ssh
      container_path: /app/.ssh
    - name: huggingface
      container_path: /app/.cache/huggingface
    - name: local
      container_path: /app/.local
health:
  kind: http
  port: 7000
  path: /api/health
  expected_status: 200
  interval_seconds: 10
  timeout_seconds: 5
  retries: 6
  start_period_seconds: 30
update:
  # sqlite schema upgrades have no documented downgrade path upstream:
  # declared honestly as irreversible, covered by the backup requirement.
  migrations: irreversible
removal:
  # User data (documents, email, notes) is irreplaceable: removal NEVER
  # deletes it; the keep-data removal path is exercised in fixtures only.
  data_policy: keep
recovery:
  image_rollback: true
backup:
  # All user state lives in the `data` volume (sqlite app.db + uploads):
  # a backup is required before any data-affecting operation.
  required: true
